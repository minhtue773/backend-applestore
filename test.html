<!doctype html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Thanh toán SePay Sandbox</title>
        <style>
            body {
                font-family:
                    system-ui,
                    -apple-system,
                    sans-serif;
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
                background-color: #f4f4f5;
                margin: 0;
            }
            .card {
                background: white;
                padding: 2rem;
                border-radius: 0.5rem;
                box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
                text-align: center;
                max-width: 400px;
                width: 100%;
            }
            .btn {
                background-color: #2563eb;
                color: white;
                border: none;
                padding: 0.75rem 1.5rem;
                font-size: 1rem;
                font-weight: 500;
                border-radius: 0.375rem;
                cursor: pointer;
                width: 100%;
                margin-top: 1rem;
            }
            .btn:hover {
                background-color: #1d4ed8;
            }
        </style>
    </head>
    <body>
        <div class="card">
            <h2>Xác nhận thanh toán</h2>
            <p>Đơn hàng: <strong>ORD-GFT2EP1ZMQ</strong></p>
            <p>Số tiền: <strong>55,960,000 VND</strong></p>

            <form
                method="POST"
                action="https://pay-sandbox.sepay.vn/v1/checkout/init"
            >
                <input type="hidden" name="merchant" value="SP-TEST-NM562897" />
                <input type="hidden" name="currency" value="VND" />
                <input type="hidden" name="order_amount" value="27780000" />
                <input type="hidden" name="operation" value="PURCHASE" />
                <input
                    type="hidden"
                    name="order_description"
                    value="Thanh toan don hang ORD-TTQ6OCCYPA"
                />
                <input
                    type="hidden"
                    name="order_invoice_number"
                    value="ORD-TTQ6OCCYPA"
                />
                <input
                    type="hidden"
                    name="success_url"
                    value="http://localhost:3000/orders/33/payment-callback?status=success"
                />
                <input
                    type="hidden"
                    name="error_url"
                    value="http://localhost:3000/orders/33/payment-callback?status=error"
                />
                <input
                    type="hidden"
                    name="cancel_url"
                    value="http://localhost:3000/orders/33/payment-callback?status=cancel"
                />
                <input
                    type="hidden"
                    name="signature"
                    value="zimYzId5QRQ+slMMOf9hTXIvMcN724Sr2LBYYPrD/dg="
                />

                <button type="submit" class="btn">Proceed to Payment</button>
            </form>
        </div>
    </body>
</html>
